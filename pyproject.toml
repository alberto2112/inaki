[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inaki"
version = "2.1.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "python-telegram-bot>=21.0",
    "markdown-it-py>=3.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "croniter>=2.0",
    "exchangelib>=5.0",
    "cryptography>=42.0",
    "typer>=0.12",
    "rich>=13.0",
    "tzlocal>=5.0",
    "pypdf>=4.0",
    "ruamel.yaml>=0.18",
    "Pillow>=10.0",
    "insightface",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-croniter>=2.0",
    "import-linter>=2.0",
]

[project.scripts]
inaki = "inaki.cli:app"

[tool.setuptools.packages.find]
include = ["inaki*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# ext/ es territorio de extensiones de usuario (gitignored, ver CLAUDE.md).
# Cada usuario gestiona su propio código de extensión — no versionamos ni
# type-checkeamos. Si una extensión tiene errores, son responsabilidad del
# usuario, no del proyecto.
exclude = ["^ext/"]

[[tool.mypy.overrides]]
# ruamel.yaml no expone py.typed marker — third-party sin stubs.
module = "ruamel.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sqlite_vec no expone py.typed marker — third-party sin stubs.
# Wrapper de extensión SQLite para vectores; usado en outbound/memory y faces.
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# exchangelib no expone py.typed marker — third-party sin stubs.
# Usado por el ext de exchange_calendar.
module = "exchangelib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# insightface no expone py.typed marker — third-party sin stubs.
# Modelo de reconocimiento facial cargado lazy en el adapter de visión.
module = "insightface.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime no expone py.typed marker — third-party sin stubs.
# Usado por el embedder e5-small ONNX (adapters/outbound/embedding/e5_onnx).
module = "onnxruntime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tokenizers (HuggingFace) no expone py.typed marker — third-party sin stubs.
# Usado por el embedder e5-small ONNX (adapters/outbound/embedding/e5_onnx).
module = "tokenizers"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Ley de dependencias entre capas — verificada por `lint-imports`.
#
# Codifica las reglas de tests/unit/test_architecture.py de forma declarativa.
# grimp incluye imports locales y bajo TYPE_CHECKING: un import "solo de tipos"
# también acopla. Regla 2 (allowlist de terceros en core/) sigue en el test de
# pytest: import-linter solo sabe PROHIBIR paquetes, no permitir una lista cerrada.
#
# Refactor modular (2026-09): cada fase agrega o endurece un contrato acá. NUNCA se resuelve una violación con ignore_imports —
# es la lista DEUDA_* con otro nombre.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["inaki"]

# La ley de capas. `inaki.shared` (primitivas) la consumen todos; el kernel
# (`inaki.kernel`: el turno y los ports que consume) no conoce a ningún módulo;
# cada módulo conoce el kernel, shared y lo que su contrato permite; solo el
# composition root (`inaki.app`, `inaki.cli`) conoce a todos.
[[tool.importlinter.contracts]]
name = "el kernel no conoce ningún módulo salvo shared"
type = "forbidden"
source_modules = ["inaki.kernel"]
forbidden_modules = [
    "inaki.cli",
    "inaki.app",
    "inaki.observability",
    "inaki.config",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
    "inaki.tools",
    "inaki.llm",
    "inaki.extensions",
    "inaki.scheduler",
    "inaki.agents",
]

[[tool.importlinter.contracts]]
name = "inaki/shared no conoce a nadie del proyecto"
type = "forbidden"
source_modules = ["inaki.shared"]
forbidden_modules = [
    "inaki.kernel",
    "inaki.cli",
    "inaki.app",
    "inaki.observability",
    "inaki.config",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
    "inaki.tools",
    "inaki.llm",
    "inaki.extensions",
    "inaki.scheduler",
    "inaki.agents",
]

[[tool.importlinter.contracts]]
name = "inaki/observability solo conoce el kernel (ports) y shared"
type = "forbidden"
source_modules = ["inaki.observability"]
forbidden_modules = [
    "inaki.cli",
    "inaki.app",
    "inaki.config",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
    "inaki.tools",
    "inaki.llm",
    "inaki.extensions",
    "inaki.scheduler",
    "inaki.agents",
]


# inaki/config es un módulo de feature: conoce shared y los ports de core, nada más.
[[tool.importlinter.contracts]]
name = "inaki/config solo conoce el kernel (ports) y shared"
type = "forbidden"
source_modules = ["inaki.config"]
forbidden_modules = [
    "inaki.cli",
    "inaki.app",
    "inaki.observability",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
    "inaki.tools",
    "inaki.llm",
    "inaki.extensions",
    "inaki.scheduler",
    "inaki.agents",
]

# Un canal conoce el kernel (core), shared, observability, config (su sección se
# registra ahí) y los módulos de feature que necesita (tools, perception). NUNCA a
# otro canal, al wiring ni al composition root.
[[tool.importlinter.contracts]]
name = "un canal no conoce el wiring ni el composition root"
type = "forbidden"
source_modules = ["inaki.channels"]
forbidden_modules = ["inaki.cli", "inaki.app"]

[[tool.importlinter.contracts]]
name = "los canales son independientes entre sí"
type = "independence"
modules = ["inaki.channels.telegram", "inaki.channels.rest", "inaki.channels.cli"]

# Un módulo de feature conoce el kernel (core) y shared; recibe su config como
# Settings VO desde el composition root. Nunca a un canal, al wiring ni a config.
[[tool.importlinter.contracts]]
name = "inaki/perception solo conoce el kernel y shared"
type = "forbidden"
source_modules = ["inaki.perception"]
forbidden_modules = [
    "inaki.cli",
    "inaki.app",
    "inaki.channels",
    "inaki.config",
    "inaki.observability",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
    "inaki.tools",
    "inaki.llm",
    "inaki.extensions",
    "inaki.scheduler",
    "inaki.agents",
]
ignore_imports = ["inaki.perception.wiring -> inaki.config"]

# Módulos de feature del núcleo: conocen el kernel (core), shared y —los que vectorizan—
# embedding. Nunca a otro módulo de feature, a un canal, al wiring ni a config.
[[tool.importlinter.contracts]]
name = "inaki/embedding solo conoce el kernel y shared"
type = "forbidden"
source_modules = ["inaki.embedding"]
forbidden_modules = [
    "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception",
    "inaki.memory", "inaki.knowledge", "inaki.skills", "inaki.tools", "inaki.llm",
    "inaki.extensions",
    "inaki.scheduler",
    "inaki.agents",
]
ignore_imports = ["inaki.embedding.wiring -> inaki.config"]

[[tool.importlinter.contracts]]
name = "inaki/memory, knowledge y skills solo conocen el kernel, shared y embedding"
type = "forbidden"
source_modules = ["inaki.memory", "inaki.knowledge", "inaki.skills"]
forbidden_modules = [
    "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception",
    "inaki.tools", "inaki.llm", "inaki.extensions", "inaki.scheduler", "inaki.agents",
]

[[tool.importlinter.contracts]]
name = "memory, knowledge y skills son independientes entre sí"
type = "independence"
modules = ["inaki.memory", "inaki.knowledge", "inaki.skills"]

# tools conoce el kernel, shared y embedding (routing semántico); nunca a otro módulo.
[[tool.importlinter.contracts]]
name = "inaki/tools solo conoce el kernel, shared y embedding"
type = "forbidden"
source_modules = ["inaki.tools"]
forbidden_modules = [
    "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception",
    "inaki.memory", "inaki.knowledge", "inaki.skills", "inaki.llm", "inaki.extensions",
    "inaki.scheduler", "inaki.agents",
]

# llm es un gateway puro: recibe ResolvedLLMConfig del wiring y no conoce a nadie más.
[[tool.importlinter.contracts]]
name = "inaki/llm solo conoce el kernel y shared"
type = "forbidden"
source_modules = ["inaki.llm"]
forbidden_modules = [
    "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception", "inaki.embedding",
    "inaki.memory", "inaki.knowledge", "inaki.skills", "inaki.tools", "inaki.extensions",
    "inaki.scheduler", "inaki.agents",
]
ignore_imports = ["inaki.llm.wiring -> inaki.config"]

# extensions solo DESCUBRE manifests: devuelve clases, paths y factories sin
# instanciar nada, así que no conoce ni a tools, ni a skills, ni a knowledge.
[[tool.importlinter.contracts]]
name = "inaki/extensions no conoce a nadie del proyecto"
type = "forbidden"
source_modules = ["inaki.extensions"]
forbidden_modules = [
    "inaki.kernel", "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception", "inaki.embedding",
    "inaki.memory", "inaki.knowledge", "inaki.skills", "inaki.tools", "inaki.llm",
    "inaki.scheduler", "inaki.agents",
]

# scheduler (tier harness-global) conoce el kernel y shared; recibe el dispatcher de
# agentes y los use cases de memoria por sus ports, nunca por import.
[[tool.importlinter.contracts]]
name = "inaki/scheduler solo conoce el kernel y shared"
type = "forbidden"
source_modules = ["inaki.scheduler"]
forbidden_modules = [
    "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception", "inaki.embedding",
    "inaki.memory", "inaki.knowledge", "inaki.skills", "inaki.tools", "inaki.llm",
    "inaki.extensions", "inaki.agents",
]

# agents conoce el kernel (one-shot, ports de delegación y scope) y shared. El
# builder del hijo efímero y wire_delegation son wiring: viven en el composition
# root hasta que exista agents/wiring.py (fase 9).
[[tool.importlinter.contracts]]
name = "inaki/agents solo conoce el kernel y shared"
type = "forbidden"
source_modules = ["inaki.agents"]
forbidden_modules = [
    "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception", "inaki.embedding",
    "inaki.memory", "inaki.knowledge", "inaki.skills", "inaki.tools", "inaki.llm",
    "inaki.extensions", "inaki.scheduler",
]
