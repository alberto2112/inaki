[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inaki"
version = "2.1.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "python-telegram-bot>=21.0",
    "markdown-it-py>=3.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "croniter>=2.0",
    "exchangelib>=5.0",
    "cryptography>=42.0",
    "typer>=0.12",
    "rich>=13.0",
    "tzlocal>=5.0",
    "pypdf>=4.0",
    "ruamel.yaml>=0.18",
    "Pillow>=10.0",
    "insightface",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-croniter>=2.0",
    "import-linter>=2.0",
]

[project.scripts]
inaki = "inaki.cli:app"

[tool.setuptools.packages.find]
include = ["inaki*", "core*", "adapters*", "infrastructure*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# ext/ es territorio de extensiones de usuario (gitignored, ver CLAUDE.md).
# Cada usuario gestiona su propio código de extensión — no versionamos ni
# type-checkeamos. Si una extensión tiene errores, son responsabilidad del
# usuario, no del proyecto.
exclude = ["^ext/"]

[[tool.mypy.overrides]]
# ruamel.yaml no expone py.typed marker — third-party sin stubs.
module = "ruamel.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sqlite_vec no expone py.typed marker — third-party sin stubs.
# Wrapper de extensión SQLite para vectores; usado en outbound/memory y faces.
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# exchangelib no expone py.typed marker — third-party sin stubs.
# Usado por el ext de exchange_calendar.
module = "exchangelib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# insightface no expone py.typed marker — third-party sin stubs.
# Modelo de reconocimiento facial cargado lazy en el adapter de visión.
module = "insightface.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime no expone py.typed marker — third-party sin stubs.
# Usado por el embedder e5-small ONNX (adapters/outbound/embedding/e5_onnx).
module = "onnxruntime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tokenizers (HuggingFace) no expone py.typed marker — third-party sin stubs.
# Usado por el embedder e5-small ONNX (adapters/outbound/embedding/e5_onnx).
module = "tokenizers"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Ley de dependencias entre capas — verificada por `lint-imports`.
#
# Codifica las reglas de tests/unit/test_architecture.py de forma declarativa.
# grimp incluye imports locales y bajo TYPE_CHECKING: un import "solo de tipos"
# también acopla. Regla 2 (allowlist de terceros en core/) sigue en el test de
# pytest: import-linter solo sabe PROHIBIR paquetes, no permitir una lista cerrada.
#
# Refactor modular (2026-09): cada fase agrega o endurece un contrato acá. NUNCA se resuelve una violación con ignore_imports —
# es la lista DEUDA_* con otro nombre.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["core", "adapters", "infrastructure", "inaki"]

# Módulos de `inaki/` que cada capa NO puede conocer. `inaki.shared` (primitivas)
# la consumen todos. Cuando `core/` se disuelva en `inaki/kernel` (fase 9) estas
# listas se convierten en el contrato de capas final.
[[tool.importlinter.contracts]]
name = "core/ no conoce adapters/, infrastructure/ ni los módulos de inaki/ salvo shared"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "adapters",
    "infrastructure",
    "inaki.cli",
    "inaki.app",
    "inaki.observability",
    "inaki.config",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
]

# adapters/ solo conoce core/ e inaki.shared: ni el wiring ni el módulo de config
# (reciben Settings VOs y paths resueltos por inyección).
[[tool.importlinter.contracts]]
name = "adapters/ no conoce infrastructure/ ni los módulos de inaki/ salvo shared"
type = "forbidden"
source_modules = ["adapters"]
forbidden_modules = [
    "infrastructure",
    "inaki.cli",
    "inaki.app",
    "inaki.observability",
    "inaki.config",
    "inaki.channels",
    "inaki.perception",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
]

[[tool.importlinter.contracts]]
name = "inaki/shared no conoce a nadie del proyecto"
type = "forbidden"
source_modules = ["inaki.shared"]
forbidden_modules = [
    "core",
    "adapters",
    "infrastructure",
    "inaki.cli",
    "inaki.app",
    "inaki.observability",
    "inaki.config",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
]

[[tool.importlinter.contracts]]
name = "inaki/observability solo conoce core (ports) y shared"
type = "forbidden"
source_modules = ["inaki.observability"]
forbidden_modules = [
    "adapters",
    "infrastructure",
    "inaki.cli",
    "inaki.app",
    "inaki.config",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
]


# inaki/config es un módulo de feature: conoce shared y los ports de core, nada más.
[[tool.importlinter.contracts]]
name = "inaki/config solo conoce core (ports) y shared"
type = "forbidden"
source_modules = ["inaki.config"]
forbidden_modules = [
    "adapters",
    "infrastructure",
    "inaki.cli",
    "inaki.app",
    "inaki.observability",
    "inaki.channels",
    "inaki.perception",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
]

# Un canal conoce el kernel (core), shared, observability y config (su sección se
# registra ahí). NUNCA a otro canal, al wiring ni al composition root. Mientras las
# tools sigan en adapters/outbound/tools (fase 7) un canal puede importarlas.
[[tool.importlinter.contracts]]
name = "un canal no conoce el wiring ni el composition root"
type = "forbidden"
source_modules = ["inaki.channels"]
forbidden_modules = ["infrastructure", "inaki.cli", "inaki.app"]

[[tool.importlinter.contracts]]
name = "los canales son independientes entre sí"
type = "independence"
modules = ["inaki.channels.telegram", "inaki.channels.rest", "inaki.channels.cli"]

# Un módulo de feature conoce el kernel (core) y shared; recibe su config como
# Settings VO desde el composition root. Nunca a un canal, al wiring ni a config.
[[tool.importlinter.contracts]]
name = "inaki/perception solo conoce core y shared"
type = "forbidden"
source_modules = ["inaki.perception"]
forbidden_modules = [
    "adapters",
    "infrastructure",
    "inaki.cli",
    "inaki.app",
    "inaki.channels",
    "inaki.config",
    "inaki.observability",
    "inaki.embedding",
    "inaki.memory",
    "inaki.knowledge",
    "inaki.skills",
]

# Módulos de feature del núcleo: conocen el kernel (core), shared y —los que vectorizan—
# embedding. Nunca a otro módulo de feature, a un canal, al wiring ni a config.
[[tool.importlinter.contracts]]
name = "inaki/embedding solo conoce core y shared"
type = "forbidden"
source_modules = ["inaki.embedding"]
forbidden_modules = [
    "adapters", "infrastructure", "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception",
    "inaki.memory", "inaki.knowledge", "inaki.skills",
]

[[tool.importlinter.contracts]]
name = "inaki/memory, knowledge y skills solo conocen core, shared y embedding"
type = "forbidden"
source_modules = ["inaki.memory", "inaki.knowledge", "inaki.skills"]
forbidden_modules = [
    "adapters", "infrastructure", "inaki.cli", "inaki.app", "inaki.channels",
    "inaki.config", "inaki.observability", "inaki.perception",
]

[[tool.importlinter.contracts]]
name = "memory, knowledge y skills son independientes entre sí"
type = "independence"
modules = ["inaki.memory", "inaki.knowledge", "inaki.skills"]
